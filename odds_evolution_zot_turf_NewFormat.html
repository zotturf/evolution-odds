<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zot Turf | Odds Evolution 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap');

:root {
    --black: #080808;
    --panel: #121212;
    --panel-2: #171717;
    --border: #2d2d2d;
    --gold: #f5c400;
    --gold-dark: #b89200;
    --burgundy: #8d1f35;
    --text: #f5f5f5;
    --muted: #a5a5a5;
    --green: #39c98a;
    --red: #ff6464;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(141,31,53,.25), transparent 28%),
        linear-gradient(180deg, #080808 0%, #0d0d0d 100%);
    color: var(--text);
    font-family: Roboto, Arial, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

.site-header {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 30px;
    padding: 0 9%;
    background: rgba(5,5,5,.97);
    border-bottom: 1px solid #272727;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    width: 92px;
    max-height: 72px;
    object-fit: contain;
}

.nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 28px;
    flex-wrap: wrap;
}

.nav a {
    font-family: Oswald, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .6px;
    color: #bdbdbd;
    text-transform: uppercase;
    transition: color .2s ease;
}

.nav a:hover,
.nav a.active {
    color: var(--gold);
}

.page-hero {
    padding: 65px 9% 48px;
    border-bottom: 1px solid #242424;
    background:
        linear-gradient(90deg, rgba(141,31,53,.30), transparent 65%),
        #0b0b0b;
}

.eyebrow {
    color: var(--gold);
    font-family: Oswald, sans-serif;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.eyebrow::before {
    content: "";
    display: inline-block;
    width: 34px;
    height: 1px;
    background: var(--gold);
}

.page-hero h1 {
    margin: 16px 0 10px;
    font-family: Oswald, sans-serif;
    font-size: clamp(34px, 5vw, 64px);
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.page-hero h1 span {
    color: var(--gold);
}

.page-hero p {
    margin: 0;
    color: #aaa;
    font-size: 15px;
}

.content {
    width: 82%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 38px 0 70px;
}

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.section-title {
    font-family: Oswald, sans-serif;
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: .8px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
}

.section-title::before {
    content: "";
    width: 5px;
    height: 31px;
    background: var(--gold);
}

.legend {
    display: flex;
    gap: 18px;
    color: var(--muted);
    font-size: 12px;
    flex-wrap: wrap;
}

.legend strong {
    color: var(--gold);
}

.race-block {
    margin: 0 0 34px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
}

.race-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 22px;
    background:
        linear-gradient(90deg, rgba(141,31,53,.75), rgba(141,31,53,.15)),
        #151515;
    border-bottom: 2px solid var(--gold);
    flex-wrap: wrap;
}

.race-heading h2 {
    margin: 0;
    font-family: Oswald, sans-serif;
    font-size: 22px;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.race-heading .race-time {
    color: var(--gold);
    font-family: Oswald, sans-serif;
    font-size: 17px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
}

thead th {
    padding: 13px 10px;
    background: #202020;
    color: var(--gold);
    font-family: Oswald, sans-serif;
    font-size: 13px;
    letter-spacing: .5px;
    text-transform: uppercase;
    border-bottom: 1px solid #383838;
    white-space: nowrap;
}

tbody td {
    padding: 12px 10px;
    text-align: center;
    font-size: 13px;
    color: #d6d6d6;
    border-bottom: 1px solid #292929;
    white-space: nowrap;
}

tbody tr:hover {
    background: #1b1b1b;
}

tbody tr.fav {
    background: linear-gradient(90deg, rgba(245,196,0,.13), rgba(245,196,0,.035));
    box-shadow: inset 5px 0 0 var(--gold);
}

tbody tr.fav td {
    color: #fff;
}

.number {
    color: var(--gold);
    font-family: Oswald, sans-serif;
    font-size: 17px;
}

.silk img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

.horse {
    min-width: 150px;
    text-align: left;
    font-weight: 700;
    color: #fff;
}

.horse .star {
    color: var(--gold);
    font-size: 17px;
    margin-left: 5px;
}

.jockey,
.trainer {
    text-align: left;
}

.odds-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(62px, 1fr));
    min-width: 500px;
    gap: 4px;
    align-items: center;
}

.odds-cell {
    min-width: 62px;
}

.odds-grid .time {
    color: #888;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    white-space: normal;
}

.odds-grid .odd {
    background: #202020;
    border: 1px solid #303030;
    padding: 6px 3px;
    border-radius: 3px;
    color: #eee;
    font-size: 12px;
    font-weight: 700;
}

.odds-grid .up {
    color: var(--red);
}

.odds-grid .down {
    color: var(--green);
}

.odds-grid .empty {
    color: #555;
}

.footer {
    padding: 45px 9%;
    background: #121212;
    border-top: 1px solid #2b2b2b;
    display: flex;
    justify-content: space-between;
    gap: 30px;
    flex-wrap: wrap;
}

.footer-brand {
    max-width: 380px;
}

.footer-brand img {
    width: 125px;
    margin-bottom: 14px;
}

.footer p {
    color: #9b9b9b;
    line-height: 1.6;
    font-size: 14px;
}

.footer-links {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
}

.footer-links a {
    color: #bbb;
    font-family: Oswald, sans-serif;
    text-transform: uppercase;
    font-size: 13px;
}

.footer-links a:hover {
    color: var(--gold);
}

.magazine-link {
    display: inline-block;
    margin-top: 6px;
    color: var(--gold);
    font-family: Oswald, sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.magazine-link:hover {
    color: #fff;
}

@media (max-width: 900px) {
    .site-header {
        height: auto;
        padding: 18px 5%;
        align-items: flex-start;
    }

    .nav {
        gap: 15px;
    }

    .page-hero {
        padding: 45px 5% 35px;
    }

    .content {
        width: 92%;
    }

    .footer {
        padding: 35px 5%;
    }
}

@media (max-width: 600px) {
    .logo {
        width: 70px;
    }

    .nav a {
        font-size: 11px;
    }

    .page-hero h1 {
        font-size: 40px;
    }

    .race-heading {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header class="site-header">
    <a href="https://www.zotturf.com/" target="_blank" aria-label="Zot Turf home">
        <img class="logo" src="zot_logo.png" alt="Zot Turf logo">
    </a>

</header>

<section class="page-hero">
    <div class="eyebrow">Zot Turf Racing Intelligence</div>
    <h1>Odds <span>Evolution</span></h1>
    <p id="meeting-subtitle">Meeting 1 · Season 2026 · Live market movement</p>
</section>

<main class="content">
    <div class="toolbar">
        <h2 class="section-title">Race-by-Race Market</h2>
        <div class="legend">
            <span><strong>↑</strong> Odds increased</span>
            <span><strong>↓</strong> Odds shortened</span>
            <span><strong>★</strong> Current favourite</span>
        </div>
    </div>

    <div id="races-container">
        <p>Loading odds evolution...</p>
    </div>
</main>

<footer class="footer">
    <div class="footer-brand">
        <img src="zot_logo.png" alt="Zot Turf">
        <p>Download our magazine on our website:</p>
        <a class="magazine-link" href="https://www.zotturf.com/" target="_blank">
            Visit Zot Turf Website →
        </a>
    </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const SHEET_URL =
        "https://opensheet.elk.sh/1vZ0GPd0L28qgLzigSlTgEXaHQb-3IuqefAcHEFrJnfk/Sheet1";

    const container = document.getElementById("races-container");

    function isEmpty(value) {
        return value === "" || value === null || value === undefined;
    }

    function getLatestOdds(row) {
        const values = [
            row.Sat10,
            row.Fri17,
            row.Fri14,
            row.Fri12,
            row.Fri10,
            row.Thu17,
            row.Thu15
        ];

        for (const value of values) {
            if (!isEmpty(value)) {
                const number = Number(value);
                if (!isNaN(number)) return number;
            }
        }

        return 999999;
    }

    function formatOdds(current, previous) {
        if (isEmpty(current)) {
            return `<div class="odd empty">—</div>`;
        }

        const curr = Number(current);

        if (isNaN(curr)) {
            return `<div class="odd empty">—</div>`;
        }

        if (isEmpty(previous)) {
            return `<div class="odd">${curr}</div>`;
        }

        const prev = Number(previous);

        if (isNaN(prev)) {
            return `<div class="odd">${curr}</div>`;
        }

        if (curr > prev) {
            return `<div class="odd up">${curr} ↑</div>`;
        }

        if (curr < prev) {
            return `<div class="odd down">${curr} ↓</div>`;
        }

        return `<div class="odd">${curr}</div>`;
    }

    function oddsEvolutionHTML(row) {
        return `
            <div class="odds-cell">
                <div class="time">Thu<br>15:00</div>
                ${formatOdds(row.Thu15, null)}
            </div>
            <div class="odds-cell">
                <div class="time">Thu<br>17:00</div>
                ${formatOdds(row.Thu17, row.Thu15)}
            </div>
            <div class="odds-cell">
                <div class="time">Fri<br>10:00</div>
                ${formatOdds(row.Fri10, row.Thu17)}
            </div>
            <div class="odds-cell">
                <div class="time">Fri<br>12:00</div>
                ${formatOdds(row.Fri12, row.Fri10)}
            </div>
            <div class="odds-cell">
                <div class="time">Fri<br>14:00</div>
                ${formatOdds(row.Fri14, row.Fri12)}
            </div>
            <div class="odds-cell">
                <div class="time">Fri<br>17:00</div>
                ${formatOdds(row.Fri17, row.Fri14)}
            </div>
            <div class="odds-cell">
                <div class="time">Sat<br>10:00</div>
                ${formatOdds(row.Sat10, row.Fri17)}
            </div>
        `;
    }

    fetch(SHEET_URL)
        .then(response => {
            if (!response.ok) throw new Error("Unable to load Google Sheet");
            return response.json();
        })
        .then(data => {
            const races = {};

            data.forEach(row => {
                if (!races[row.Race]) races[row.Race] = [];
                races[row.Race].push(row);
            });

            container.innerHTML = "";

            Object.keys(races)
                .sort((a, b) => Number(a) - Number(b))
                .forEach(raceNumber => {

                    const raceData = races[raceNumber];
                    const info = raceData[0];

                    const minOdds = Math.min(
                        ...raceData.map(row => getLatestOdds(row))
                    );

                    let html = `
                        <section class="race-block">
                            <div class="race-heading">
                                <h2>Race ${raceNumber} · ${info.RaceName || ""}</h2>
                                <div class="race-time">${info.Time || ""}</div>
                            </div>

                            <div class="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>Silk</th>
                                            <th>Horse</th>
                                            <th>Jockey</th>
                                            <th>Trainer</th>
                                            <th>Weight</th>
                                            <th>Draw</th>
                                            <th>Odds Evolution</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    raceData.forEach(row => {
                        const currentOdds = getLatestOdds(row);
                        const isFavourite = currentOdds === minOdds;

                        html += `
                            <tr class="${isFavourite ? "fav" : ""}">
                                <td class="number">${row.No || ""}</td>

                                <td class="silk">
                                    <img src="silks/${row.Silk || ""}"
                                         alt=""
                                         onerror="this.style.display='none'">
                                </td>

                                <td class="horse">
                                    ${row.Horse || ""}
                                    ${isFavourite ? '<span class="star">★</span>' : ""}
                                </td>

                                <td class="jockey">${row.Jockey || ""}</td>
                                <td class="trainer">${row.Trainer || ""}</td>
                                <td>${row.Weight || ""}</td>
                                <td>${row.Draw || ""}</td>

                                <td>
                                    <div class="odds-grid">
                                        ${oddsEvolutionHTML(row)}
                                    </div>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    `;

                    container.innerHTML += html;
                });
        })
        .catch(error => {
            console.error(error);
            container.innerHTML =
                `<p style="color:#ff6464;">Unable to load odds data. Please check the Google Sheet connection.</p>`;
        });
});
</script>

</body>
</html>
